{% comment %}Estilos do cartão realista com flip 3D (CSS puro). Incluir uma vez por página.{% endcomment %}
<style>
  .cc-card { perspective: 1200px; display: block; text-decoration: none; }
  .cc-inner {
    position: relative; width: 100%; aspect-ratio: 1.586 / 1;
    transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.7,.2,1);
    border-radius: 16px;
  }
  .cc-card:hover .cc-inner, .cc-card:focus-visible .cc-inner { transform: rotateY(180deg); }
  .cc-face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    border-radius: 16px; padding: 20px; color: #fff; overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,.25); display: flex; flex-direction: column;
    justify-content: space-between; font-family: "Segoe UI", Arial, sans-serif;
  }
  .cc-face::after { /* brilho sutil */
    content: ""; position: absolute; top: -40%; left: -20%; width: 60%; height: 180%;
    background: linear-gradient(120deg, rgba(255,255,255,.18), rgba(255,255,255,0));
    transform: rotate(20deg); pointer-events: none;
  }
  .cc-back { transform: rotateY(180deg); }
  .cc-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .cc-apelido { font-size: .8rem; opacity: .9; font-weight: 600; letter-spacing: .3px; }
  .cc-brand { font-size: 2.4rem; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.3)); }
  .cc-chip {
    width: 44px; height: 32px; border-radius: 6px; margin: 6px 0 2px;
    background: linear-gradient(135deg, #d4af37, #f6e27a 45%, #b8860b);
    box-shadow: inset 0 0 3px rgba(0,0,0,.4);
  }
  .cc-number { font-size: 1.35rem; letter-spacing: 2px; font-family: "Consolas","Courier New",monospace; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .cc-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .cc-label { font-size: .55rem; text-transform: uppercase; opacity: .75; letter-spacing: .5px; }
  .cc-value { font-size: .82rem; font-weight: 600; text-transform: uppercase; }
  .cc-holder { max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-stripe { height: 42px; background: #1a1a1a; margin: 8px -20px 0; }
  .cc-sign { background: #e6e6e6; color: #333; height: 30px; border-radius: 4px; margin-top: 16px; display: flex; align-items: center; justify-content: flex-end; padding: 0 8px; font-size: .7rem; font-style: italic; }
  .cc-inactive { position: absolute; top: 10px; right: 12px; z-index: 2; background: rgba(0,0,0,.55); font-size: .6rem; padding: 2px 6px; border-radius: 4px; }

  /* Selo textual da Elo (FontAwesome não tem glifo) — não reproduz o logotipo oficial */
  .cc-elo-badge {
    display: inline-block; font-weight: 800; font-style: italic; font-size: 1.1rem;
    letter-spacing: 1px; padding: 2px 8px; border-radius: 6px; background: #fff; color: #111;
  }

  /* Gradientes por bandeira */
  .cc-VISA       { background: linear-gradient(135deg, #141e5c, #2a4fd6 70%, #4b6cb7); }
  .cc-MASTERCARD { background: linear-gradient(135deg, #2b2b2b, #6d1a1a 75%, #a12a2a); }
  .cc-ELO        { background: linear-gradient(135deg, #0d0d0d, #2a2a2a 70%, #3a3a3a); }
  .cc-AMEX       { background: linear-gradient(135deg, #0b6e6e, #16a085 75%, #2fc79b); }
</style>
