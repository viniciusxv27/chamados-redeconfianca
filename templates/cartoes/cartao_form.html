{% extends "base.html" %}

{% block title %}Novo Cartão{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-4 sm:p-6 lg:p-8">
  <nav class="mb-4 text-sm">
    <a href="{% url 'cartoes:dashboard' %}" class="text-gray-500 hover:text-purple-600">
      <i class="fas fa-arrow-left mr-1"></i> Cartões
    </a>
  </nav>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b bg-purple-50">
      <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
        <i class="fas fa-plus-circle text-purple-600"></i> Novo cartão de crédito
      </h1>
    </div>

    <form method="post" class="p-6 space-y-5">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Apelido <span class="text-gray-400 font-normal">(opcional)</span></label>
        <input type="text" name="apelido" maxlength="60" value="{{ form.apelido|default:'' }}"
               placeholder="Ex.: Cartão Compras Loja 1"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">4 primeiros dígitos</label>
          <input type="text" name="first4" inputmode="numeric" pattern="\d{4}" maxlength="4" required
                 value="{{ form.first4|default:'' }}" placeholder="1234"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg tracking-widest text-center focus:ring-2 focus:ring-purple-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">4 últimos dígitos</label>
          <input type="text" name="last4" inputmode="numeric" pattern="\d{4}" maxlength="4" required
                 value="{{ form.last4|default:'' }}" placeholder="5678"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg tracking-widest text-center focus:ring-2 focus:ring-purple-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Usuário responsável</label>
        <select name="responsavel" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
          <option value="">Selecione o responsável...</option>
          {% for u in users %}
          <option value="{{ u.id }}" {% if form.responsavel == u.id|stringformat:'s' %}selected{% endif %}>
            {{ u.get_full_name|default:u.email }}{% if u.email %} — {{ u.email }}{% endif %}
          </option>
          {% endfor %}
        </select>
        <p class="text-xs text-gray-500 mt-1">Só o responsável (e SUPERADMIN) poderá lançar gastos neste cartão.</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Validade — mês</label>
          <input type="number" name="validade_mes" min="1" max="12" required
                 value="{{ form.validade_mes|default:'' }}" placeholder="MM"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg text-center focus:ring-2 focus:ring-purple-500">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Validade — ano</label>
          <input type="number" name="validade_ano" min="{{ ano_atual }}" max="2099" required
                 value="{{ form.validade_ano|default:'' }}" placeholder="AAAA"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg text-center focus:ring-2 focus:ring-purple-500">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Bandeira</label>
        <select name="bandeira" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
          <option value="">Selecione a bandeira...</option>
          {% for code, label in bandeiras %}
          <option value="{{ code }}" {% if form.bandeira == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex items-center justify-end gap-3 pt-2 border-t">
        <a href="{% url 'cartoes:dashboard' %}" class="px-5 py-2 text-gray-600 hover:text-gray-900">Cancelar</a>
        <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg transition-colors">
          <i class="fas fa-save"></i> Criar cartão
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
