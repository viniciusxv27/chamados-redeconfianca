{% extends 'base.html' %}
{% block title %}Publicação de {{ p.autor.first_name }} · Feed da rede{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-0 sm:px-2 py-4 sm:py-6">
    <a href="{% url 'social:feed' %}" class="inline-flex items-center gap-1 text-sm font-semibold text-gray-500 hover:text-gray-800 mb-3 px-1"><i class="fas fa-arrow-left"></i>Feed da rede</a>
    <div data-sf-lista>{% include 'social/_post.html' with p=p abrir_todos=True comentarios=comentarios %}</div>
</div>
{% include 'social/_script.html' %}
{% endblock %}
