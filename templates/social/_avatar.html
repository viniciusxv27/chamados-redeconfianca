{% comment %}Foto da pessoa (ou iniciais). Parâmetros: u e tam (classe de tamanho, ex.: "w-9 h-9").{% endcomment %}{% if u.profile_picture %}<img src="{{ u.profile_picture.url }}" alt="" loading="lazy" decoding="async" class="{{ tam|default:'w-9 h-9' }} rounded-full object-cover flex-shrink-0 sf-avatar">{% else %}<span class="{{ tam|default:'w-9 h-9' }} rounded-full flex items-center justify-center flex-shrink-0 sf-avatar sf-iniciais">{{ u.first_name|slice:":1"|upper }}{{ u.last_name|slice:":1"|upper }}</span>{% endif %}
