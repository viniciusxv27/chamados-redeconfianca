{% extends "base.html" %}

{% block title %}Novo item de preço{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto p-4 sm:p-6 lg:p-8">
  <nav class="mb-4 text-sm"><a href="{% url 'vendas:precos' %}" class="text-gray-500 hover:text-purple-600"><i class="fas fa-arrow-left mr-1"></i> Tabela de preços</a></nav>
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <div class="px-6 py-4 border-b bg-purple-50"><h1 class="text-xl font-bold text-gray-900 flex items-center gap-2"><i class="fas fa-plus-circle text-purple-600"></i> Novo item de preço</h1></div>
    <form method="post" class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Categoria</label>
        <input type="text" name="categoria" list="cats" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
        <datalist id="cats">{% for c in categorias %}<option value="{{ c }}">{% endfor %}</datalist>
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Valor (R$)</label>
        <input type="number" step="0.01" min="0" name="valor" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-right focus:ring-2 focus:ring-purple-500">
      </div>
      <div class="sm:col-span-2">
        <label class="block text-sm font-semibold text-gray-700 mb-1">Nome</label>
        <input type="text" name="nome" required maxlength="200" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
      </div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Plano</label><input type="text" name="plano" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Sistema</label><input type="text" name="sistema" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Grupamento</label><input type="text" name="grupamento" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></div>
      <div><label class="block text-sm font-semibold text-gray-700 mb-1">Cód. SAP</label><input type="text" name="cod_sap" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"></div>
      <div class="sm:col-span-2 flex items-center justify-end gap-3 pt-2 border-t">
        <a href="{% url 'vendas:precos' %}" class="px-5 py-2 text-gray-600 hover:text-gray-900">Cancelar</a>
        <button type="submit" class="inline-flex items-center gap-2 px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg"><i class="fas fa-save"></i> Salvar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
