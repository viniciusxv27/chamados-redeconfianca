{# Navegação das telas do SUPERADMIN em /files/ (ativa = qual destacar). #}
<div class="flex flex-wrap items-center gap-2 mb-6">
    <a href="{% url 'files:files_list' %}" class="text-sm text-gray-600 hover:text-gray-900 mr-2"><i class="fas fa-arrow-left mr-1"></i>Arquivos</a>
    <a href="{% url 'files:por_usuario' %}" class="px-3 py-1.5 rounded-lg text-sm border {% if ativa == 'usuario' %}bg-gray-900 text-white border-gray-900{% else %}bg-white text-gray-700 border-gray-300 hover:bg-gray-50{% endif %}"><i class="fas fa-user-gear mr-1"></i>Por usuário</a>
    <a href="{% url 'files:movimentacoes' %}" class="px-3 py-1.5 rounded-lg text-sm border {% if ativa == 'movimentacoes' %}bg-gray-900 text-white border-gray-900{% else %}bg-white text-gray-700 border-gray-300 hover:bg-gray-50{% endif %}"><i class="fas fa-clock-rotate-left mr-1"></i>Movimentações</a>
    <a href="{% url 'files:lixeira' %}" class="px-3 py-1.5 rounded-lg text-sm border {% if ativa == 'lixeira' %}bg-gray-900 text-white border-gray-900{% else %}bg-white text-gray-700 border-gray-300 hover:bg-gray-50{% endif %}"><i class="fas fa-trash-arrow-up mr-1"></i>Lixeira</a>
</div>
