{% extends 'impulso/base_impulso.html' %}

{% block impulso_content %}
<div class="max-w-2xl">
    <div class="mb-4">
        <a href="{% url 'impulso:projeto_foco_list' %}" class="text-sm text-gray-500 hover:text-gray-800"><i class="fas fa-arrow-left mr-1"></i>Voltar</a>
    </div>
    <div class="imp-card p-5">
        <h2 class="text-lg font-semibold text-gray-800 mb-4"><i class="fas fa-diagram-project text-emerald-500 mr-2"></i>Novo projeto foco</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome *</label>
                <input type="text" name="nome" required maxlength="200" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
                <textarea name="descricao" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Equipe do projeto</label>
                <select name="membros" multiple size="6" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    {% for c in colaboradores %}<option value="{{ c.id }}">{{ c.get_full_name|default:c.email }}</option>{% endfor %}
                </select>
                <p class="text-xs text-gray-400 mt-1">Segure Ctrl/Cmd para selecionar vários.</p>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <a href="{% url 'impulso:projeto_foco_list' %}" class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 text-sm hover:bg-gray-200">Cancelar</a>
                <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-500 text-white text-sm hover:bg-emerald-600">Criar projeto</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
