{# Cartão de indicador. Params: icon, cor, label, valor #}
<div class="imp-card imp-card-hover p-3.5">
    <div class="flex items-center gap-2">
        <i class="fas {{ icon }} {{ cor }} text-sm"></i>
        <span class="text-2xl font-bold text-gray-900 tabular-nums leading-none">{{ valor|default:0 }}</span>
    </div>
    <span class="text-xs text-gray-500 mt-1.5 block">{{ label }}</span>
</div>
