{% extends 'impulso/base_impulso.html' %}

{% block impulso_content %}
<div class="max-w-2xl">
    <div class="mb-4">
        <a href="{% url 'impulso:inovar_list' %}" class="text-sm text-gray-500 hover:text-gray-800"><i class="fas fa-arrow-left mr-1"></i>Voltar</a>
    </div>
    <div class="imp-card p-5">
        <h2 class="text-lg font-semibold text-gray-800 mb-1"><i class="fas fa-lightbulb text-yellow-500 mr-2"></i>Nova ideia</h2>
        <p class="text-sm text-gray-500 mb-4">Informe de forma concreta a sua ideia, o setor de impacto e o motivo.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Qual é a sua ideia? *</label>
                <textarea name="descricao" required rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Setor de impacto *</label>
                <input type="text" name="setor_impacto" required maxlength="150" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex.: Atendimento, Financeiro, TI…">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Qual o motivo? *</label>
                <textarea name="motivo" required rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <a href="{% url 'impulso:inovar_list' %}" class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 text-sm hover:bg-gray-200">Cancelar</a>
                <button type="submit" class="px-4 py-2 rounded-lg bg-yellow-500 text-white text-sm hover:bg-yellow-600">Enviar ideia</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
