{% extends 'impulso/base_impulso.html' %}

{% block impulso_content %}
<div class="max-w-xl">
    <div class="mb-4">
        <a href="{% url 'impulso:ciclo_list' %}" class="text-sm text-gray-500 hover:text-gray-900"><i class="fas fa-arrow-left mr-1"></i>Voltar</a>
    </div>
    <div class="imp-card p-6">
        <h2 class="text-lg font-bold text-gray-900 mb-1"><i class="fas fa-calendar-plus text-orange-500 mr-2"></i>Iniciar ciclo</h2>
        <p class="text-sm text-gray-500 mb-5">Os meses do período são criados automaticamente. A cada mês você poderá "finalizar mês" para congelar a pontuação.</p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome do ciclo *</label>
                <input type="text" name="nome" required maxlength="120" value="{{ sugestao_nome }}"
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-400 focus:border-orange-400">
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Início *</label>
                    <input type="date" name="inicio" required value="{{ hoje|date:'Y-m-d' }}"
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-400 focus:border-orange-400">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fim *</label>
                    <input type="date" name="fim" required
                           class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-400 focus:border-orange-400">
                </div>
            </div>
            <p class="text-xs text-gray-400"><i class="fas fa-circle-info mr-1"></i>Um ciclo costuma durar 3 meses.</p>
            <div class="flex justify-end gap-2 pt-2">
                <a href="{% url 'impulso:ciclo_list' %}" class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 text-sm hover:bg-gray-200">Cancelar</a>
                <button type="submit" class="px-4 py-2 rounded-lg bg-orange-600 text-white text-sm font-medium hover:bg-orange-700 shadow-sm">Iniciar ciclo</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
