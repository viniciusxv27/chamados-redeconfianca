{% extends 'impulso/base_impulso.html' %}

{% block impulso_content %}
<div class="max-w-2xl">
    <div class="mb-4">
        <a href="{% url 'impulso:metas_kanban' %}" class="text-sm text-gray-500 hover:text-gray-800"><i class="fas fa-arrow-left mr-1"></i>Voltar ao Kanban</a>
    </div>
    <div class="rounded-xl border border-gray-200 p-5">
        <h2 class="text-lg font-semibold text-gray-800 mb-4"><i class="fas fa-bullseye text-amber-500 mr-2"></i>Nova meta</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Colaborador *</label>
                <select name="colaborador" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                    <option value="">Selecione…</option>
                    {% for c in colaboradores %}
                    <option value="{{ c.id }}">{{ c.get_full_name|default:c.email }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Título *</label>
                <input type="text" name="titulo" required maxlength="200" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Ex.: Reduzir tempo de resposta dos chamados">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Descrição (clara, por textos) *</label>
                <textarea name="descricao" required rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" placeholder="Descreva a meta de forma clara e objetiva…"></textarea>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Periodicidade *</label>
                    <select name="periodicidade" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                        {% for value, label in periodicidades %}
                        <option value="{{ value }}" {% if value == 'MENSAL' %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prazo *</label>
                    <input type="date" name="prazo" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <a href="{% url 'impulso:metas_kanban' %}" class="px-4 py-2 rounded-lg bg-gray-100 text-gray-700 text-sm hover:bg-gray-200">Cancelar</a>
                <button type="submit" class="px-4 py-2 rounded-lg bg-amber-500 text-white text-sm hover:bg-amber-600">Criar meta</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
