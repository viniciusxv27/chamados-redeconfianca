{% extends 'reunioes/_visitante_base.html' %}
{% block titulo %}Você saiu da reunião{% endblock %}

{% block corpo %}
{% load static %}
<div class="rn-capa min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl px-6 py-8 text-center">
        <img src="{% static 'images/logo3.png' %}" alt="Rede Confiança"
             class="w-14 h-14 mx-auto mb-4 rounded-2xl shadow-md">
        <h1 class="text-lg font-bold text-gray-900">Você saiu da reunião</h1>
        {% if reuniao %}
        <p class="text-sm text-gray-600 mt-2">{{ reuniao.titulo }}</p>
        <a href="{% url 'reunioes:sala_publica' reuniao.token_publico %}"
           class="inline-block mt-5 px-5 py-2.5 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-orange-600">
            <i class="fas fa-rotate-left mr-1.5"></i>Voltar para a sala
        </a>
        {% else %}
        <p class="text-sm text-gray-600 mt-2">Obrigado por participar.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
