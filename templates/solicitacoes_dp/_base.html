{% extends 'tangerino/base_tangerino.html' %}

{% block tg_conteudo %}
<style>
  .dp-chip { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .6rem; border-radius: 9999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .dp-ENVIADA { background: #FEF3C7; color: #92400E; }
  .dp-EM_ANALISE { background: #E0F2FE; color: #075985; }
  .dp-DEVOLVIDA { background: #FFEDD5; color: #9A3412; }
  .dp-APROVADA { background: #D1FAE5; color: #065F46; }
  .dp-CANCELADA { background: #F3F4F6; color: #4B5563; }
  .dp-tipo { width: 2.5rem; height: 2.5rem; border-radius: .8rem; display: grid; place-items: center; flex: none; }
  .dp-AJUSTE { background: #ECFEFF; color: #0E7490; }
  .dp-ATESTADO { background: #FEF2F2; color: #B91C1C; }
  .dp-DECLARACAO { background: #F5F3FF; color: #6D28D9; }
  .dp-campo { width: 100%; border: 1px solid #D1D5DB; border-radius: .6rem; padding: .5rem .75rem; font-size: .875rem; background: #fff; }
  .dp-campo:focus { outline: none; border-color: #0891B2; box-shadow: 0 0 0 3px rgba(8,145,178,.15); }
  .dp-rotulo { display: block; font-size: .75rem; font-weight: 600; color: #4B5563; margin-bottom: .25rem; }
  html.dark .dp-campo { background: var(--tema-superficie-2, #232a3b); border-color: var(--tema-borda, #313a4f); color: var(--tema-texto, #e7eaf0); }
  html.dark .dp-rotulo { color: var(--tema-texto-2, #b6bdcc); }
  html.dark .tg-card { background: var(--tema-superficie, #1b2130); border-color: var(--tema-borda, #313a4f); }
  html.dark .dp-ENVIADA { background: rgba(245,158,11,.15); color: #FBBF24; }
  html.dark .dp-EM_ANALISE { background: rgba(14,165,233,.15); color: #7DD3FC; }
  html.dark .dp-DEVOLVIDA { background: rgba(249,115,22,.15); color: #FDBA74; }
  html.dark .dp-APROVADA { background: rgba(16,185,129,.15); color: #6EE7B7; }
  html.dark .dp-CANCELADA { background: rgba(255,255,255,.06); color: #9CA3AF; }
</style>
{% block dp_conteudo %}{% endblock %}
{% endblock %}
