<div class="bg-white rounded-lg p-4 shadow-sm" style="background-color: var(--ct-superficie) !important; border: 2px solid #6b7280 !important;">
    <label class="block mb-2 text-sm font-semibold text-gray-800">Por que esta venda <u>não</u> vai ser contestada? <span class="text-red-600">*</span></label>
    <textarea class="nao-input w-full" data-id="{{ r.pk }}" rows="3" minlength="{{ min_justificativa }}"
              placeholder="Justificativa obrigatória (ex.: cliente cancelou de fato, venda duplicada...)"
              style="padding: 0.75rem !important; border: 2px solid var(--ct-borda-campo) !important; border-radius: 0.75rem !important; background-color: var(--ct-campo) !important; font-size: 0.875rem !important;"></textarea>
    <p class="nao-erro hidden mt-1 text-xs font-semibold text-red-700" data-id="{{ r.pk }}"></p>
    <div class="flex items-center gap-2 mt-3">
        <button type="button" onclick="confirmarNao({{ r.pk }})" class="inline-flex items-center px-4 py-2 rounded-lg text-white text-sm font-semibold" style="background-color: #4b5563">
            <i class="fas fa-check mr-2"></i> Confirmar Não
        </button>
        <button type="button" onclick="fecharCaixaNao({{ r.pk }})" class="inline-flex items-center px-4 py-2 rounded-lg text-sm font-semibold" style="background-color: var(--ct-borda-campo); color: var(--ct-texto);">
            Cancelar
        </button>
    </div>
</div>
