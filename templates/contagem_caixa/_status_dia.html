<span class="cx-status inline-block px-2 py-0.5 rounded text-[11px] font-semibold cx-{{ d.status|lower }}"{% if d.conferido %} title="Diferença de {{ d.divergencia_conferida }} conferida por {{ d.conferido_por.get_full_name|default:d.conferido_por.username|default:'—' }} em {{ d.conferido_em|date:'d/m/Y H:i' }}{% if d.conferido_nota %} · {{ d.conferido_nota }}{% endif %}"{% endif %}>{% if d.conferido %}<i class="fas fa-check mr-0.5"></i>{% endif %}{{ d.status_rotulo }}</span>
{% if pode_conferir and d.em_atencao %}<button type="button" class="cx-conferir ml-1 px-1.5 py-0.5 rounded text-[11px] font-semibold text-emerald-700 border border-emerald-200 hover:bg-emerald-50" data-acao="conferir" title="A diferença já foi verificada (ajuste manual, por exemplo): dar OK">dar OK</button>{% elif pode_conferir and d.conferido %}<button type="button" class="cx-conferir ml-1 text-[11px] text-gray-400 hover:text-red-600 hover:underline" data-acao="desfazer" title="Tirar o OK: o dia volta para Atenção">desfazer</button>{% endif %}
