{% extends 'cameras/_base.html' %}
{% block ca_titulo %}{{ gravador.loja }}{% endblock %}
{% block ca_conteudo %}
<header class="ca-topo"><div class="ca-titulo"><a class="ca-voltar" href="{% url 'cameras:configuracao' %}" aria-label="Voltar"><i class="fas fa-arrow-left"></i></a><div><h1>{{ gravador.loja }}</h1><p>Dados do gravador e horário da loja</p></div></div></header>
<form method="post" class="ca-card ca-form">{% csrf_token %}
    <label>Loja<input name="loja" value="{{ gravador.loja }}" required></label>
    <label>Coordenação<input name="coordenador" value="{{ gravador.coordenador }}"></label>
    <label>Setor no portal<select name="setor"><option value="">—</option>{% for s in setores %}<option value="{{ s.id }}" {% if gravador.setor_id == s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></label>
    <label>Tem gravador?<select name="tem_equipamento"><option value="1" {% if gravador.tem_equipamento %}selected{% endif %}>Sim</option><option value="0" {% if not gravador.tem_equipamento %}selected{% endif %}>Não</option></select></label>
    <label>Serial<input name="serial" value="{{ gravador.serial }}"></label>
    <label>Quantidade de câmeras<input type="number" name="canais" min="1" max="64" value="{{ quantos }}"></label>
    <label>Usuário<input name="usuario" value="{{ gravador.usuario }}" autocomplete="off"></label>
    <label>Senha<input type="password" name="senha" autocomplete="new-password" placeholder="{% if gravador.senha_cifrada %}Em branco mantém a atual{% else %}Sem senha guardada{% endif %}"></label>
    <label>IP do gravador na loja<input name="ip_local" value="{{ gravador.ip_local }}" placeholder="192.168.1.108"></label>
    <label>Porta RTSP<input type="number" name="porta_rtsp" value="{{ gravador.porta_rtsp }}"></label>
    <label class="inteiro">Caminho RTSP<input name="caminho_rtsp" value="{{ gravador.caminho_rtsp }}"><small>Use {canal} no lugar do número. O padrão serve para Intelbras; confira o do Motorola na instalação.</small></label>
    <label>Abre às<input type="time" name="abre_as" value="{{ gravador.abre_as|time:'H:i' }}"></label>
    <label>Fecha às<input type="time" name="fecha_as" value="{{ gravador.fecha_as|time:'H:i' }}"></label>
    <label>Matinal a partir de<input type="time" name="matinal_inicio" value="{{ gravador.matinal_inicio|time:'H:i' }}"></label>
    <label>Matinal antes de<input type="time" name="matinal_fim" value="{{ gravador.matinal_fim|time:'H:i' }}"></label>
    <label>Matinal dura ao menos (min)<input type="number" name="matinal_minutos" min="1" max="120" value="{{ gravador.matinal_minutos }}"></label>
    <label>Tolerância de horário (min)<input type="number" name="tolerancia_horario" min="0" max="240" value="{{ gravador.tolerancia_horario }}"><small>Antes de abrir e depois de fechar, gente na loja é a equipe abrindo ou fechando: não vira alerta.</small></label>
    <fieldset class="inteiro ca-tipos-alerta"><legend>Alertas desta loja</legend><input type="hidden" name="tem_tipos_alerta" value="1">
        <label class="ca-chave"><input type="checkbox" checked disabled> Aparelho saiu do mostruário</label>
        <label class="ca-chave"><input type="checkbox" name="alerta_fora_horario" value="1" {% if gravador.alerta_fora_horario %}checked{% endif %}> Pessoa com a loja fechada</label>
        <label class="ca-chave"><input type="checkbox" name="alerta_permanencia" value="1" {% if gravador.alerta_permanencia %}checked{% endif %}> Permanência longa na área <small>(dispara com a equipe no mostruário; ligue só se a loja precisar)</small></label>
    </fieldset>
    <div class="inteiro ca-fim"><a class="ca-botao claro" href="{% url 'cameras:configuracao' %}">Cancelar</a><button class="ca-botao">Salvar</button></div>
</form>
{% endblock %}
