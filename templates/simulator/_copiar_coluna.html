{% comment %}
Botões do cabeçalho da tabela do Simulador: trocam a coluna inteira pelos valores
da visão Projeção ou Realizado da pessoa selecionada (JS no dashboard.html).
Recebe: coluna = meta | real | realpdv.
{% endcomment %}
<div class="mt-1 flex flex-wrap justify-end gap-1 font-normal" data-copiar-grupo="{{ coluna }}">
  <button type="button" data-copiar-coluna="{{ coluna }}" data-copiar-visao="projecao"
          class="sim-copiar-btn inline-flex items-center gap-1 px-2 py-1 text-[11px] leading-tight rounded border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100 whitespace-nowrap disabled:opacity-60 disabled:cursor-wait"
          title="Preenche a coluna com a projeção do mês">
    <i class="fas fa-chart-line" aria-hidden="true"></i><span>Copiar Projeção</span>
  </button>
  <button type="button" data-copiar-coluna="{{ coluna }}" data-copiar-visao="realizado"
          class="sim-copiar-btn inline-flex items-center gap-1 px-2 py-1 text-[11px] leading-tight rounded border border-green-200 bg-green-50 text-green-700 hover:bg-green-100 whitespace-nowrap disabled:opacity-60 disabled:cursor-wait"
          title="Preenche a coluna com o realizado até agora">
    <i class="fas fa-check-circle" aria-hidden="true"></i><span>Copiar Realizado</span>
  </button>
</div>
